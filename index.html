function questionId(q){return q[0]+'-'+q[1].toLowerCase().replace(/[^a-z0-9äöüß]+/g,'-').slice(0,90)}

 let fresh=pool.filter(q=>!used.has(questionId(q)));
 if(fresh.length<count){fresh=pool;seen=[];toast('Du hast diesen Fragenpool einmal durchgeübt – die Fragen werden neu gemischt.')}
 const selected=shuffleList(fresh).slice(0,Math.min(count,fresh.length));
 const ids=selected.map(questionId);
 try{localStorage.setItem(key,JSON.stringify([...new Set([...seen,...ids])].slice(-2000)))}catch(_){}
 return shuffleList(selected).map(prepareQuestion);
}

function localSave(o){localStorage.setItem('bf_demo',JSON.stringify({...localGet(),...o}))}

async function saveProfile(){let v={display_name:$('#displayName').value.trim()||'Feuerwehr-Azubi',daily_goal:Math.max(5,Math.min(480,Number($('#goal').value)||30))};profile={...profile,...v};if(sb){let {error}=await sb.from('profiles').upsert({id:user.id,...v});if(error)return toast(error.message)}else localSave({profile});toast('Einstellungen gespeichert')}
async function saveResult(moduleId,correct,total){let row={module_id:moduleId,correct,total,question_ids:questions.map(q=>q[5]).filter(Boolean),created_at:new Date().toISOString()};if(sb){let {error}=await sb.from('progress').insert({user_id:user.id,...row});if(error){toast('Speichern fehlgeschlagen: '+error.message);return}}progressRows.push(row);if(!sb)localSave({progress:progressRows});if(sessionStart){let mins=Math.max(1,Math.round((Date.now()-sessionStart)/60000));if(sb)await sb.from('study_sessions').insert({user_id:user.id,minutes:mins});else{let d=localGet();localSave({minutes:(d.minutes||0)+mins})}}}
function totalCorrect(){return progressRows.reduce((a,r)=>a+(r.correct||0),0)}function totalQuestions(){return progressRows.reduce((a,r)=>a+(r.total||0),0)}
function pageNav(p){page=p;render()}
function nav(){return '<div class="navlabel">LERNBEREICH</div>'+[['dashboard','▦','Übersicht'],['lernen','▤','Testbereiche'],['pruefung','✓','Prüfungstraining'],['gruppen','♧','Gemeinsam lernen'],['fortschritt','▥','Mein Fortschritt'],['material','▧','Lernmaterialien'],['einstellungen','⚙','Einstellungen']].map(x=>'<button class="nav '+(page===x[0]?'active':'')+'" data-page="'+x[0]+'"><span>'+x[1]+'</span>'+x[2]+'</button>').join('')}
function frame(content){$('#root').innerHTML='<div class="app"><header class="top"><div class="brand"><div class="brandmark">✚</div><div>BF EINSTELLUNGSTEST<small>BERUFSFEUERWEHR NÜRNBERG · 2. QE</small></div></div><div class="topright"><span class="useremail muted">'+esc(user?.email||'Gastmodus')+'</span><button class="btn secondary small" id="logout">Abmelden</button></div></header><div class="shell"><aside class="side">'+nav()+'</aside><main class="main">'+content+'<div class="footer">BF Einstellungstest Trainer ist ein privates Lern- und Übungsangebot. Inhalte ersetzen keine Feuerwehr-Ausbildung, keine örtlichen Dienstanweisungen und keine gültigen Vorschriften. Im Einsatz gelten Ausbildung, Führung und die jeweils gültigen Regelungen.</div></main></div></div>';document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>pageNav(b.dataset.page));$('#logout').onclick=logout}
function dashboard(){let q=totalQuestions(),c=totalCorrect(),p=pct(c,q);return '<div class="eyebrow">NÜRNBERG · MITTLERER FEUERWEHRTECHNISCHER DIENST</div><div class="notice">Dein Trainer orientiert sich am veröffentlichten Auswahlverfahren der Berufsfeuerwehr Nürnberg. Die Stadt nennt Sporttest, schriftlichen Test, praktischen Test, Bewerbungsgespräch und gesundheitliche Prüfung.</div><h1 class="h1">Moin, '+esc(profile.display_name||'Feuerwehr-Azubi')+'! 👋</h1><p class="sub">Bleib dran – jeder Lernschritt bringt dich deinem Ziel näher.</p><div class="grid"><div class="card span3"><div class="metric">'+q+'</div><div class="metriclabel">Beantwortete Fragen</div></div><div class="card span3"><div class="metric">'+p+'%</div><div class="metriclabel">Trefferquote</div></div><div class="card span3"><div class="metric">'+progressRows.length+'</div><div class="metriclabel">Abgeschlossene Tests</div></div><div class="card span3"><div class="metric">'+(profile.daily_goal||30)+' min</div><div class="metriclabel">Dein Tagesziel</div></div><div class="card span7"><div class="bar"><div><div class="cardtitle">Dein Lernstand</div><div class="muted" style="font-size:12px">Gesamte bisherige Quiz-Ergebnisse</div></div><span class="pill">'+p+'% richtig</span></div><div class="progress"><i style="width:'+p+'%"></i></div><button class="btn" onclick="pageNav(\'lernen\')">Weiterüben →</button></div><div class="card span5"><div class="cardtitle">Tagesziel</div><div class="metric">'+(profile.daily_goal||30)+' Minuten</div><p class="muted" style="font-size:13px">Plane eine feste Lernzeit pro Tag. Du kannst dein Ziel jederzeit ändern.</p><button class="btn secondary" onclick="pageNav(\'einstellungen\')">Lernziel einstellen</button></div><div class="card span12"><div class="bar"><div class="cardtitle">Deine Lernmodule</div><button class="btn ghost small" onclick="pageNav(\'lernen\')">Alle ansehen</button></div>'+modules.slice(0,4).map(m=>'<div class="topic"><div class="topicicon">'+m.icon+'</div><div class="topicinfo"><strong>'+m.title+'</strong><small>'+m.desc+'</small></div><button class="btn secondary small" onclick="startModule(\''+m.id+'\')">Üben</button></div>').join('')+'</div></div>'}
function learning(){return '<div class="eyebrow">WISSEN AUFBAUEN</div><h1 class="h1">Lernmodule</h1><p class="sub">Bereite dich gezielt auf den Einstellungstest der Berufsfeuerwehr vor: Deutsch, Mathematik, Logik, Technik, Allgemeinwissen und mehr.</p><div class="grid"><div class="card span12"><div class="bar"><div><div class="cardtitle">Zufälliges Mischtraining</div><p class="muted" style="font-size:13px">20 Fragen aus allen Themengebieten – bei jedem Start neu gemischt, mit wechselnder Antwortreihenfolge.</p></div><button class="btn" onclick="startModule(\'mix\')">Gemischt üben →</button></div></div>'+modules.map(m=>'<div class="card span6"><div class="bar"><div class="topicicon">'+m.icon+'</div><span class="pill">'+m.level+'</span></div><h3>'+m.title+'</h3><p class="muted" style="font-size:13px;min-height:40px">'+m.desc+'</p><div class="muted" style="font-size:12px">'+m.topics.length+' Themenbereiche</div><div class="progress"><i style="width:'+pct(progressRows.filter(x=>x.module_id===m.id).length,4)+'%"></i></div><button class="btn" onclick="startModule(\''+m.id+'\')">Wissen testen →</button><div style="margin-top:14px;font-size:12px;color:#91a1b1">'+m.topics.map(t=>'• '+t).join('<br>')+'</div></div>').join('')+'</div>'}
function startModule(id){questions=pickQuestions(id,(id==='all'||id==='mix')?20:Math.min(10,bank.filter(q=>q[0]===id).length));if(!questions.length){toast('Für diesen Bereich sind noch keine Fragen vorhanden.');return}qIndex=0;score=0;sessionStart=Date.now();renderQuiz(id)}
function renderQuiz(id,feedback=''){let q=questions[qIndex];frame('<div class="eyebrow">WISSENSCHECK</div><div class="bar"><h1 class="h1">'+(modules.find(m=>m.id===id)?.title||'Prüfungstraining')+'</h1><span class="pill">Frage '+(qIndex+1)+' / '+questions.length+'</span></div><div class="progress"><i style="width:'+pct(qIndex,questions.length)+'%"></i></div><div class="card"><div class="muted" style="font-size:12px">WÄHLE DIE RICHTIGE ANTWORT</div><div class="question">'+esc(q[1])+'</div><div id="answers">'+q[2].map((a,i)=>'<button class="answer" data-answer="'+i+'">'+String.fromCharCode(65+i)+'. '+esc(a)+'</button>').join('')+'</div><div id="explain"></div><div class="bar" style="margin-top:18px"><span class="muted" style="font-size:12px">Richtig: '+score+'</span><button id="next" class="btn hidden">'+(qIndex===questions.length-1?'Ergebnis anzeigen':'Nächste Frage →')+'</button></div></div><button class="btn ghost small" style="margin-top:15px" onclick="pageNav(\'lernen\')">Training verlassen</button>');document.querySelectorAll('[data-answer]').forEach(b=>b.onclick=()=>{if($('#next').classList.contains('hidden')===false)return;let n=+b.dataset.answer,ok=n===q[3];if(ok)score++;document.querySelectorAll('[data-answer]').forEach((x,i)=>{x.disabled=true;if(i===q[3])x.classList.add('correct');else if(i===n)x.classList.add('wrong')});$('#explain').innerHTML='<div class="notice '+(ok?'':'danger')+'">'+(ok?'Richtig! Gut gemacht.':'Leider nicht richtig.')+' '+esc(q[4])+'</div>';$('#next').classList.remove('hidden')});$('#next').onclick=async()=>{qIndex++;if(qIndex<questions.length)renderQuiz(id);else{await saveResult(id,score,questions.length);frame('<div class="card" style="text-align:center;padding:38px"><div style="font-size:48px">🏁</div><div class="eyebrow">TRAINING ABGESCHLOSSEN</div><h1 class="h1">Gut gemacht!</h1><div class="metric">'+score+' / '+questions.length+'</div><p class="sub">Du hast '+pct(score,questions.length)+'% richtig beantwortet.</p><div class="progress"><i style="width:'+pct(score,questions.length)+'%"></i></div><p class="muted">Schau dir die Themen noch einmal an, bei denen du unsicher warst.</p><button class="btn" onclick="pageNav(\'fortschritt\')">Fortschritt ansehen</button> <button class="btn secondary" onclick="pageNav(\'lernen\')">Weiterlernen</button></div>')}}}
function exam(){return '<div class="eyebrow">PRÜFUNGSVORBEREITUNG · NÜRNBERG</div><h1 class="h1">Prüfungstraining</h1><p class="sub">Die Stadt Nürnberg beschreibt vier schriftliche Bereiche mit jeweils 30 Minuten: Deutsch, Mathematik, Allgemeinwissen und Logik. Diese Simulation mischt eigene Übungsfragen aus genau diesen Bereichen.</p><div class="grid"><div class="card span7"><div class="cardtitle">Schriftliche Nürnberg-Simulation</div><div class="metric">20 Fragen · 120 Minuten als Orientierung</div><p class="muted">Gemischte Übungsfragen aus Deutsch, Mathematik, Allgemeinwissen und Logik. Die Zeitangabe bildet die vier offiziellen Zeitblöcke nach, die Aufgaben sind nicht original.</p><button class="btn" onclick="startModule(\'all\')">Prüfung beginnen →</button></div><div class="card span5"><div class="cardtitle">Aufbau laut Stadt Nürnberg</div><p class="sub">Deutsch · 30 Min.<br>Mathematik · 30 Min.<br>Allgemeinwissen · 30 Min.<br>Logiktest · 30 Min.</p><span class="pill">Kein Taschenrechner / keine Formelsammlung laut Aufgabenbeschreibung</span></div><div class="card span12"><div class="cardtitle">Sporttest: veröffentlichte Anforderungen für Volljährige</div><p class="sub">3.000 m in höchstens 15:00 min · 200 m Schwimmen in höchstens 5:00 min · Kasten-Bumerang in 20 s · 42 Wechselsprünge in 30 s · Beugehang 44 s · 75-kg-Dummy in höchstens 60 s · Streckentauchen bis 15 m · 30-m-Leitersteigen in höchstens 60 s.</p><p class="muted" style="font-size:12px">Die Stadt nennt ein K.-o.-System. Die oben genannten Grenzwerte gelten für Volljährige; für Minderjährige nennt die Stadt teilweise andere Werte. Bitte vor dem Training die aktuelle Ausschreibung und offizielle Seite prüfen.</p><a class="link" target="_blank" rel="noopener" href="https://www.nuernberg.de/internet/arbeitgeberin/einstellungstest.html">Offizielle Anforderungen bei der Stadt Nürnberg ↗</a></div></div>'}
function progressPage(){let q=totalQuestions(),c=totalCorrect();return '<div class="eyebrow">DEINE ENTWICKLUNG</div><h1 class="h1">Mein Fortschritt</h1><p class="sub">Hier siehst du, wo du schon sicher bist und wo sich Wiederholen lohnt.</p><div class="grid"><div class="card span4"><div class="metric">'+pct(c,q)+'%</div><div class="metriclabel">Gesamte Trefferquote</div></div><div class="card span4"><div class="metric">'+progressRows.length+'</div><div class="metriclabel">Trainings abgeschlossen</div></div><div class="card span4"><div class="metric">'+q+'</div><div class="metriclabel">Fragen beantwortet</div></div><div class="card span12"><div class="cardtitle">Feedback nach Themen</div>'+modules.map(m=>{let a=progressRows.filter(x=>x.module_id===m.id),n=a.reduce((s,x)=>s+(x.total||0),0),v=a.reduce((s,x)=>s+(x.correct||0),0),pc=pct(v,n),label=n===0?'Noch keine Daten':pc>=85?'Sehr gut':pc>=70?'Gut':pc>=50?'Ausbaufähig':'Mehr üben';return '<div class="topic"><div class="topicicon">'+m.icon+'</div><div class="topicinfo"><strong>'+m.title+'</strong><small>'+label+' · '+(n?pc+'% richtig':'Starte deinen ersten Test')+'</small><div class="progress"><i style="width:'+pc+'%"></i></div></div><span class="pill">'+(n?pc+'%':'Neu')+'</span></div>'}).join('')+'</div><div class="notice span12">Die Bewertung ist eine Lernhilfe auf Basis deiner Quizantworten, keine offizielle Leistungsbewertung oder Eignungsfeststellung.</div></div>'}
function materials(){let links=[['Stadt Nürnberg – offizieller Einstellungstest','Alle fünf Teile, Disziplinen, Zeiten und Aufgabenbeispiele des Auswahlverfahrens','https://www.nuernberg.de/internet/arbeitgeberin/einstellungstest.html'],['Stadt Nürnberg – Trainingsempfehlungen Sporttest (PDF)','Offizielle Trainingshinweise für Lauf, Leitersteigen, Wechselsprünge und Personenrettung','https://www.nuernberg.de/imperia/md/feuerwehr/dokumente/vorbereitung_sporttest.pdf'],['Stadt Nürnberg – Berufswege bei der Feuerwehr','Informationen zu den Nürnberger Einstiegswegen und Laufbahnen','https://www.nuernberg.de/internet/feuerwehr/jobs_feuerwehr.html'],['Feuerwehr-Lernbar Bayern','Kostenlose Lernmodule, Ausbildungspakete, Quiz und Fachwissen','https://feuerwehr-lernbar.bayern.de/'],['Landesfeuerwehrschule Baden-Württemberg','Offizielle Fachinformationen und Angebote der Landesfeuerwehrschule','https://www.lfs-bw.de/themen/'],['Deutscher Feuerwehrverband – Ausbildungsunterlagen','Übersicht mit Links zu kostenlosen Ausbildungsangeboten','https://www.feuerwehrverband.de/app/uploads/2024/12/DFV-Uebersicht_Ausbildungsunterlagen_Internet_v1-3_2024-12-01.pdf'],['Feuerwehr-Lernbar – Ausbildungsunterlagen','Kostenlose Downloads, Ausbildungsunterlagen, Präsentationen und Arbeitsblätter','https://www.feuerwehr-lernbar.bayern.de/'],['DFV direkt','Kostenlose Online-Fortbildungen und Videoaufzeichnungen','https://www.feuerwehrverband.de/veranstaltungen/dfv-direkt/'],['Feuerwehr NRW – Arbeitshilfen','Sammlung von Lernplattformen und fachlichen Arbeitshilfen','https://www.feuerwehr-nrw.de/service/arbeitshilfen/']];return '<div class="eyebrow">KOSTENLOSE QUELLEN</div><h1 class="h1">Lernmaterialien</h1><p class="sub">Ausgewählte frei zugängliche Fachquellen. Bitte prüfe immer, ob Vorschriften und Unterlagen für dein Bundesland aktuell und gültig sind.</p><div class="grid"><div class="card span12">'+links.map(x=>'<div class="topic"><div class="topicicon">📚</div><div class="topicinfo"><strong>'+x[0]+'</strong><small>'+x[1]+'</small></div><a class="btn secondary small" target="_blank" rel="noopener" href="'+x[2]+'">Öffnen ↗</a></div>').join('')+'</div><div class="notice span12">Hinweis: Verlinkte Materialien bleiben Eigentum der jeweiligen Herausgeber. Die Plattform kopiert keine fremden Lehrbücher oder Prüfungsunterlagen. Eigene Lernfragen dienen der Orientierung und ersetzen keine offizielle Ausbildung.</div></div>'}
async function groups(){let list=[];if(sb){let r=await sb.from('study_rooms').select('id,name,description,created_at').order('created_at',{ascending:false});list=r.data||[]}else list=localGet().rooms||[];return '<div class="eyebrow">LERNEN IM TEAM</div><h1 class="h1">Gemeinsam lernen</h1><p class="sub">Erstelle einen Lernraum und teile den Raumcode mit deinen Kameraden. Gemeinsam Fragen wiederholen und Lernziele verfolgen.</p><div class="grid"><div class="card span5"><div class="cardtitle">Neuen Lernraum erstellen</div><label>Name der Lerngruppe</label><input id="roomName" class="field" placeholder="z. B. BF Prüfungsvorbereitung"><label>Beschreibung</label><input id="roomDesc" class="field" placeholder="Themen und Lernziel"><button id="createRoom" class="btn">Lernraum erstellen</button><hr style="border-color:var(--line);margin:22px 0"><div class="cardtitle">Mit Raumcode beitreten</div><input id="roomCode" class="field" placeholder="Raumcode eingeben"><button id="joinRoom" class="btn secondary">Beitreten</button></div><div class="card span7"><div class="cardtitle">Offene Lerngruppen</div>'+(list.length?list.map(x=>'<div class="room"><strong>'+esc(x.name)+'</strong><p class="muted" style="font-size:12px">'+esc(x.description||'Gemeinsam lernen')+'</p><div class="bar"><span class="pill">Code: '+esc(x.id.toUpperCase())+'</span><button class="btn secondary small" onclick="openRoom(\''+x.id+'\')">Raum öffnen</button></div></div>').join(''):'<p class="muted">Noch keine Lerngruppen vorhanden. Erstelle den ersten Raum!</p>')+'</div></div>'}
async function createRoom(){let name=$('#roomName').value.trim(),description=$('#roomDesc').value.trim();if(!name)return toast('Bitte gib einen Namen ein.');if(!sb)return toast('Für gemeinsame Lerngruppen zuerst Firebase einrichten (siehe README).');let code=Math.random().toString(36).slice(2,10).toUpperCase();let {data,error}=await sb.from('study_rooms').insert({id:code,name,description,created_by:user.id}).select().single();if(error)return toast(error.message);let member=await sb.from('room_members').insert({room_id:data.id,user_id:user.id});if(member.error)return toast(member.error.message);toast('Lernraum erstellt! Raumcode: '+code);pageNav('gruppen')}
async function joinRoom(){let code=$('#roomCode').value.trim();if(!sb)return toast('Für gemeinsame Lerngruppen zuerst Firebase einrichten.');let {data,error}=await sb.from('study_rooms').select('id').eq('id',code.toUpperCase()).maybeSingle();if(error||!data)return toast('Raum nicht gefunden. Prüfe den Code.');let r=await sb.from('room_members').upsert({room_id:data.id,user_id:user.id});if(r.error)return toast(r.error.message);toast('Du bist dem Lernraum beigetreten.');openRoom(data.id)}
async function openRoom(id){if(!sb)return toast('Gemeinsame Räume benötigen die Online-Datenbank.');let r=await sb.from('study_rooms').select('*').eq('id',id).single();if(r.error)return toast(r.error.message);let m=await sb.from('room_members').select('user_id').eq('room_id',id);let room=r.data;selectedRoom=id;frame('<div class="eyebrow">LERNGRUPPE</div><h1 class="h1">'+esc(room.name)+'</h1><p class="sub">'+esc(room.description||'Gemeinsam lernen')+'</p><div class="grid"><div class="card span7"><div class="cardtitle">Raum-Informationen</div><p>Teile diesen Code mit deinen Lernpartnern:</p><div class="metric">'+id.toUpperCase()+'</div><button class="btn secondary small" id="copyCode">Code kopieren</button><p class="muted" style="font-size:12px">Raumchat und Live-Quiz können im nächsten Ausbau ergänzt werden. Hier ist zunächst die gemeinsame Raumverwaltung verfügbar.</p></div><div class="card span5"><div class="cardtitle">Mitglieder ('+(m.data||[]).length+')</div>'+((m.data||[]).map(x=>'<div class="topic"><div class="topicicon">👤</div><strong>'+esc(x.profiles?.display_name||'Mitglied')+'</strong></div>').join('')||'<p class="muted">Noch keine Mitglieder</p>')+'</div></div><button class="btn ghost" onclick="pageNav(\'gruppen\')">← Zurück zu Gruppen</button>');$('#copyCode').onclick=()=>navigator.clipboard.writeText(id.toUpperCase()).then(()=>toast('Raumcode kopiert'))}
function settings(){return '<div class="eyebrow">DEIN PROFIL</div><h1 class="h1">Einstellungen</h1><div class="grid"><div class="card span6"><div class="cardtitle">Persönliche Angaben</div><label>Anzeigename</label><input id="displayName" class="field" value="'+esc(profile.display_name||'')+'"><label>Dein tägliches Lernziel (Minuten)</label><input id="goal" class="field" type="number" min="5" max="480" value="'+(profile.daily_goal||30)+'"><button class="btn" id="saveSettings">Speichern</button></div><div class="card span6"><div class="cardtitle">Dein Konto</div><p class="muted">'+esc(user?.email||'Gastmodus')+'</p><div class="notice">'+(sb?'Dein Konto und Lernstand werden online gespeichert und sind nach erneuter Anmeldung verfügbar.':'Demo-Modus: Deine Daten bleiben nur in diesem Browser. Für dauerhaftes Speichern und gemeinsame Lerngruppen richte Firebase ein (Anleitung in README).')+'</div></div></div>'}
function render(){if(page==='dashboard')frame(dashboard());if(page==='lernen')frame(learning());if(page==='pruefung')frame(exam());if(page==='fortschritt')frame(progressPage());if(page==='material')frame(materials());if(page==='einstellungen')frame(settings());if(page==='gruppen')groups().then(h=>{if(page==='gruppen'){frame(h);$('#createRoom').onclick=createRoom;$('#joinRoom').onclick=joinRoom}});if(page==='einstellungen'){$('#saveSettings').onclick=saveProfile}}
async function logout(){if(sb)await sb.auth.signOut();user=null;authScreen()}
function authScreen(){if(!ready){$('#root').innerHTML='<div class="authwrap"><div class="card auth"><div class="brand"><div class="brandmark">✚</div><div>BF EINSTELLUNGSTEST<small>BERUFSFEUERWEHR · TRAINING</small></div></div><div class="pill red">DEMO-MODUS</div><h1>Starte dein Training.</h1><p class="sub">Du kannst die Lernmodule direkt ausprobieren. Für dauerhaftes Konto, Synchronisierung und Lerngruppen müssen die kostenlosen Firebase-Zugangsdaten eingetragen werden. Die Anleitung liegt in README.md.</p><label>Dein Anzeigename</label><input id="guestName" class="field" placeholder="Dein Name" value="Feuerwehr-Azubi"><button class="btn" style="width:100%" id="guest">Als Gast starten →</button><p class="footer">Demo-Daten bleiben auf diesem Gerät in diesem Browser gespeichert.</p></div></div>';$('#guest').onclick=async()=>{profile={display_name:$('#guestName').value||'Feuerwehr-Azubi',daily_goal:30};user={email:'Gastmodus'};await loadData();render()};return}
$('#root').innerHTML='<div class="authwrap"><div class="card auth"><div class="brand"><div class="brandmark">✚</div><div>BF EINSTELLUNGSTEST<small>BERUFSFEUERWEHR · TRAINING</small></div></div><h1>Willkommen zurück.</h1><p class="sub">Melde dich an oder erstelle dein persönliches Lernkonto.</p><div class="bar"><button class="btn secondary small" id="tabLogin">Anmelden</button><button class="btn ghost small" id="tabSignup">Konto erstellen</button></div><label>E-Mail-Adresse</label><input id="email" class="field" type="email" placeholder="name@beispiel.de"><label>Passwort</label><input id="password" class="field" type="password" placeholder="Mindestens 8 Zeichen"><div id="authMsg" class="muted" style="font-size:12px;margin:5px 0 12px"></div><button class="btn" id="authAction" style="width:100%">Anmelden</button></div></div>';let mode='login';const setMode=m=>{mode=m;$('#authAction').textContent=m==='login'?'Anmelden':'Konto erstellen';$('#tabLogin').className='btn '+(m==='login'?'secondary':'ghost')+' small';$('#tabSignup').className='btn '+(m==='signup'?'secondary':'ghost')+' small'};$('#tabLogin').onclick=()=>setMode('login');$('#tabSignup').onclick=()=>setMode('signup');$('#authAction').onclick=async()=>{let email=$('#email').value.trim(),password=$('#password').value;if(!email||password.length<8)return $('#authMsg').textContent='Bitte E-Mail und ein Passwort mit mindestens 8 Zeichen eingeben.';let r=mode==='signup'?await sb.auth.signUp({email,password}):await sb.auth.signInWithPassword({email,password});if(r.error)return $('#authMsg').textContent=r.error.message;if(mode==='signup'&&!r.data.session)return $('#authMsg').textContent='Bitte bestätige deine E-Mail-Adresse über den zugesandten Link.';user=r.data.user;await loadData();render()}}
async function init(){if(!ready){authScreen();return}authScreen();let first=true;try{sb.auth.onAuthStateChange(async(_e,s)=>{try{if(first){first=false;if(s){user=s.user;await loadData();render()}else authScreen();return}if(s&&!user){user=s.user;await loadData();render()}else if(!s&&user){user=null;authScreen()}}catch(e){showStartupError(e)}})}catch(e){showStartupError(e)}}
function showStartupError(error){const message=error?.message||String(error||'Unbekannter Fehler');$('#root').innerHTML='<div class="authwrap"><div class="card auth"><div class="brand"><div class="brandmark">✚</div><div>BF EINSTELLUNGSTEST<small>BERUFSFEUERWEHR · TRAINING</small></div></div><div class="pill red">FIREBASE-STARTFEHLER</div><h1>Die Lernplattform konnte nicht starten.</h1><p class="sub">Die Verbindung zu Firebase ist fehlgeschlagen. Prüfe, ob Cloud Firestore erstellt und die E-Mail/Passwort-Anmeldung aktiviert ist.</p><div class="notice danger" style="overflow-wrap:anywhere">'+esc(message)+'</div><p class="footer">Bitte kontrolliere außerdem, ob in Firebase die Web-App-Konfiguration zu diesem Projekt gehört und die Firestore-Regeln veröffentlicht sind.</p><button class="btn" style="width:100%" onclick="location.reload()">Erneut versuchen</button></div></div>'}
window.pageNav=pageNav;window.startModule=startModule;window.openRoom=openRoom;init();
</script></body></html>
