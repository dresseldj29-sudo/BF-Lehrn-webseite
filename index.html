#432c25;color:#ffd3b0}.authwrap{min-height:100vh;display:grid;place-items:center;padding:20px;background:radial-gradient(ellipse at 80% 15%,#392a2a 0,transparent 38%),var(--bg)}.auth{max-width:440px;width:100%;padding:30px}.auth h1{font:800 27px Manrope}.auth .brand{margin-bottom:28px}.link{color:#ff967e;text-decoration:none}.link:hover{text-decoration:underline}.badge{font-size:11px;color:var(--green);font-weight:800}.room{padding:14px;border:1px solid var(--line);border-radius:12px;margin:9px 0;background:#101b25}.footer{font-size:11px;color:#738495;line-height:1.6;margin-top:30px}.toast{position:fixed;bottom:20px;right:20px;background:#233542;border:1px solid #435768;padding:13px 18px;border-radius:11px;z-index:20;box-shadow:0 8px 30px #0008}.mobilemenu{display:none}

<body><div id="root"><div class="authwrap"><div class="card auth"><div class="brand"><div class="brandmark">✚</div><div>BF LERNAKADEMIE<small>BERUFSFEUERWEHR · TRAINING</small></div></div><h1>Dein Wissen. Dein Einsatz.</h1><p class="sub">Deine persönliche Lernplattform wird geladen …</p></div></div></div>
<script src="config.js"></script><script>
const CFG=window.BF_CONFIG||{};const ready=!!(CFG.SUPABASE_URL&&CFG.SUPABASE_ANON_KEY&&window.supabase);
let sb=ready?window.supabase.createClient(CFG.SUPABASE_URL,CFG.SUPABASE_ANON_KEY):null;
const $=s=>document.querySelector(s);let user=null,profile=null,progressRows=[],page='dashboard',questions=[],qIndex=0,score=0,selectedRoom=null,sessionStart=null;
const modules=[
{ id:'grundlagen',icon:'🚒',title:'Feuerwehr-Grundlagen',level:'Grundwissen',desc:'Aufgaben, Organisation, Einheiten und Einsatzgrundsätze',topics:['Aufgaben der Feuerwehr','Aufbau und Organisation','Mannschaften und Funktionen','Gefahren an der Einsatzstelle']},
{ id:'brand',icon:'🔥',title:'Brand & Löschlehre',level:'Fachwissen',desc:'Verbrennung, Brandklassen, Löschmittel und Taktik',topics:['Verbrennungslehre','Brandklassen und Löschmittel','Wärmeübertragung','Grundlagen der Brandbekämpfung']},
{ id:'technik',icon:'🧰',title:'Technische Hilfeleistung',level:'Fachwissen',desc:'Gerätekunde, Sicherung und technische Rettung',topics:['TH-Grundlagen','Gerätekunde','Einsatzstellen sichern','Grundlagen Verkehrsunfall']},
{ id:'atemschutz',icon:'🫁',title:'Atemschutz & Sicherheit',level:'Vertiefung',desc:'Persönliche Schutzausrüstung, Sicherheit und Hygiene',topics:['Atemschutz-Grundlagen','Sicherheitstrupp und Rückwegsicherung','Einsatzstellenhygiene','Unfallverhütung']},
{ id:'funk',icon:'📻',title:'Funk & Kommunikation',level:'Grundwissen',desc:'Kommunikation, Funkdisziplin und Meldungen',topics:['Grundlagen Sprechfunk','Funkdisziplin','Lagemeldungen','Kommunikation im Einsatz']},
{ id:'fuehrung',icon:'🧭',title:'Taktik & Führung',level:'Vertiefung',desc:'Einsatzführung, Lagebeurteilung und Zusammenarbeit',topics:['Führungsvorgang','Erkundung und Lage','Befehl und Rückmeldung','Zusammenarbeit der Einheiten']},
{ id:'erstehilfe',icon:'⛑️',title:'Erste Hilfe & Rettung',level:'Grundwissen',desc:'Lebensrettende Basismaßnahmen und Zusammenarbeit',topics:['Erste-Hilfe-Grundlagen','Notruf und Rettungskette','Betreuung und Patientenübergabe','Eigenschutz']},
{ id:'recht',icon:'⚖️',title:'Recht & Dienstvorschriften',level:'Vertiefung',desc:'Rechtsgrundlagen, FwDV und Verantwortung',topics:['FwDV 1 – Grundtätigkeiten','FwDV 2 – Ausbildung','FwDV 3 – Einheiten','Rechte und Pflichten']}
];
const bank=[
['grundlagen','Welche Aufgabe gehört zu den gesetzlichen Kernaufgaben der Feuerwehr?',['Brandbekämpfung und Hilfeleistung','Verkehrsüberwachung','Strafverfolgung','Bauplanung'],0,'Die konkreten Aufgaben ergeben sich aus dem jeweiligen Landesrecht. Brandbekämpfung und Hilfeleistung gehören zu den typischen Kernaufgaben.'],
['grundlagen','Was bedeutet Eigenschutz im Feuerwehreinsatz?',['Die eigene Sicherheit und die des Teams beachten','Immer zuerst das Fahrzeug sichern','Nur mit erfahrenen Kräften sprechen','Auf jede Rückmeldung verzichten'],0,'Eigenschutz hat bei jeder Maßnahme hohe Priorität. Gefahren müssen erkannt und geeignete Schutzmaßnahmen umgesetzt werden.'],
['brand','Was benötigt eine Verbrennung im klassischen Verbrennungsdreieck?',['Brennstoff, Sauerstoff und Wärme','Wasser, Luft und Rauch','Holz, Schaum und Druck','Licht, Stickstoff und Wasser'],0,'Das Verbrennungsdreieck beschreibt Brennstoff, Sauerstoff und Wärme. Wird eine Voraussetzung entzogen, kann die Verbrennung unterbrochen werden.'],
['brand','Welche Aussage zu Brandklassen ist richtig?',['Brandklasse A umfasst feste, glutbildende Stoffe','Brandklasse A umfasst ausschließlich Metalle','Brandklasse F umfasst gasförmige Stoffe','Brandklasse D umfasst Speiseöle'],0,'Brandklasse A umfasst feste Stoffe, die normalerweise unter Glutbildung verbrennen, zum Beispiel Holz oder Papier.'],
['technik','Was ist vor dem Einsatz technischer Geräte grundsätzlich wichtig?',['Gefahrenbereich beurteilen und Eigenschutz sicherstellen','Sofort mit maximaler Leistung beginnen','Absprache ist nicht notwendig','Nur auf die Geschwindigkeit achten'],0,'Vor jeder Maßnahme sind Lage, Gefahren und erforderliche Sicherungsmaßnahmen zu beurteilen.'],
['atemschutz','Wofür steht die Abkürzung PSA?',['Persönliche Schutzausrüstung','Prüfung sicherer Atemluft','Persönlicher Sicherheitsalarm','Praktische Schutzanweisung'],0,'PSA steht für persönliche Schutzausrüstung. Welche PSA erforderlich ist, richtet sich nach Tätigkeit und Gefährdungsbeurteilung.'],
['funk','Was ist bei einer Funkmeldung besonders wichtig?',['Kurz, klar und verständlich sprechen','Möglichst viele private Informationen nennen','Gleichzeitig mit anderen sprechen','Abkürzungen ohne Absprache verwenden'],0,'Funkmeldungen sollen knapp, eindeutig und verständlich sein. Die geltenden Regeln und örtlichen Vorgaben sind zu beachten.'],
['fuehrung','Was ist ein wesentliches Ziel der Erkundung?',['Ein Lagebild gewinnen und Gefahren erkennen','Nur die Fahrzeugposition bestimmen','Die Einsatzdauer schätzen','Die Personalakte prüfen'],0,'Die Erkundung dient dazu, die Lage zu erfassen, Gefahren zu erkennen und Entscheidungen vorzubereiten.'],
['erstehilfe','Was ist bei einem Notruf besonders wichtig?',['Wo ist der Notfall und was ist passiert?','Nur den eigenen Namen nennen','Erst auflegen und dann warten','Keine Rückfragen beantworten'],0,'Wichtige Angaben sind insbesondere Ort, Ereignis, betroffene Personen und Rückfragen der Leitstelle.'],
['recht','Wofür steht FwDV?',['Feuerwehr-Dienstvorschrift','Fahrzeugdienstverordnung','Feuerwehr-Datenverwaltung','Führungsdienstvereinbarung'],0,'FwDV steht für Feuerwehr-Dienstvorschrift. Die jeweils gültige Fassung und landesspezifische Einführung beachten.'],
['brand','Welche Aussage zu Löschmitteln ist korrekt?',['Die Eignung hängt unter anderem von Brandklasse und Gefahren ab','Wasser ist immer für jeden Brand geeignet','Alle Löschmittel wirken gleich','Löschmittel dürfen beliebig gemischt werden'],0,'Die Wahl des Löschmittels muss zur Brandklasse, Situation und den Gefahren passen.'],
['atemschutz','Was ist nach einem kontaminierenden Brandeinsatz wichtig?',['Kontaminationsverschleppung vermeiden und Hygienevorgaben beachten','Einsatzkleidung im Mannschaftsraum ausschütteln','Schutzkleidung privat weiterverwenden','Hygiene ist nur bei Gefahrgut nötig'],0,'Einsatzstellenhygiene schützt vor Schadstoffverschleppung. Maßgeblich sind die örtlichen Hygiene- und Dekontaminationskonzepte.']
];
function toast(s){let n=document.createElement('div');n.className='toast';n.textContent=s;document.body.append(n);setTimeout(()=>n.remove(),3200)}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function pct(a,b){return b?Math.round(a/b*100):0}
function localGet(){return JSON.parse(localStorage.getItem('bf_demo')||'{}')}
function localSave(o){localStorage.setItem('bf_demo',JSON.stringify({...localGet(),...o}))}
async function loadData(){if(!sb){let d=localGet();profile=d.profile||{display_name:'Gast',daily_goal:30};progressRows=d.progress||[];return}let p=await sb.from('profiles').select('*').eq('id',user.id).maybeSingle();profile=p.data||{id:user.id,display_name:user.email.split('@')[0],daily_goal:30};let r=await sb.from('progress').select('*').eq('user_id',user.id);progressRows=r.data||[]}
async function saveProfile(){let v={display_name:$('#displayName').value.trim()||'Feuerwehr-Azubi',daily_goal:Number($('#goal').value)||30};profile={...profile,...v};if(sb){let {error}=await sb.from('profiles').upsert({id:user.id,...v});if(error)return toast(error.message)}else localSave({profile});toast('Einstellungen gespeichert')}
async function saveResult(moduleId,correct,total){let row={module_id:moduleId,correct,total,created_at:new Date().toISOString()};if(sb){let {error}=await sb.from('progress').insert({user_id:user.id,...row});if(error){toast('Speichern fehlgeschlagen: '+error.message);return}}else{progressRows.push(row);localSave({progress:progressRows})}progressRows.push(row);if(sessionStart){let mins=Math.max(1,Math.round((Date.now()-sessionStart)/60000));if(sb)await sb.from('study_sessions').insert({user_id:user.id,minutes:mins});else{let d=localGet();localSave({minutes:(d.minutes||0)+mins})}}}
function totalCorrect(){return progressRows.reduce((a,r)=>a+(r.correct||0),0)}function totalQuestions(){return progressRows.reduce((a,r)=>a+(r.total||0),0)}
function pageNav(p){page=p;render()}
function nav(){return '<div class="navlabel">LERNBEREICH</div>'+[['dashboard','▦','Übersicht'],['lernen','▤','Lernmodule'],['pruefung','✓','Prüfungstraining'],['gruppen','♧','Gemeinsam lernen'],['fortschritt','▥','Mein Fortschritt'],['material','▧','Lernmaterialien'],['einstellungen','⚙','Einstellungen']].map(x=>'<button class="nav '+(page===x[0]?'active':'')+'" data-page="'+x[0]+'"><span>'+x[1]+'</span>'+x[2]+'</button>').join('')}
function frame(content){$('#root').innerHTML='<div class="app"><header class="top"><div class="brand"><div class="brandmark">✚</div><div>BF LERNAKADEMIE<small>BERUFSFEUERWEHR · TRAINING</small></div></div><div class="topright"><span class="useremail muted">'+esc(user?.email||'Gastmodus')+'</span><button class="btn secondary small" id="logout">Abmelden</button></div></header><div class="shell"><aside class="side">'+nav()+'</aside><main class="main">'+content+'<div class="footer">BF Lernakademie ist ein privates Lern- und Übungsangebot. Inhalte ersetzen keine Feuerwehr-Ausbildung, keine örtlichen Dienstanweisungen und keine gültigen Vorschriften. Im Einsatz gelten Ausbildung, Führung und die jeweils gültigen Regelungen.</div></main></div></div>';document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>pageNav(b.dataset.page));$('#logout').onclick=logout}
function dashboard(){let q=totalQuestions(),c=totalCorrect(),p=pct(c,q);return '<div class="eyebrow">DEIN TRAININGSZENTRUM</div><h1 class="h1">Moin, '+esc(profile.display_name||'Feuerwehr-Azubi')+'! 👋</h1><p class="sub">Bleib dran – jeder Lernschritt bringt dich deinem Ziel näher.</p><div class="grid"><div class="card span3"><div class="metric">'+q+'</div><div class="metriclabel">Beantwortete Fragen</div></div><div class="card span3"><div class="metric">'+p+'%</div><div class="metriclabel">Trefferquote</div></div><div class="card span3"><div class="metric">'+progressRows.length+'</div><div class="metriclabel">Abgeschlossene Tests</div></div><div class="card span3"><div class="metric">'+(profile.daily_goal||30)+' min</div><div class="metriclabel">Dein Tagesziel</div></div><div class="card span7"><div class="bar"><div><div class="cardtitle">Dein Lernstand</div><div class="muted" style="font-size:12px">Gesamte bisherige Quiz-Ergebnisse</div></div><span class="pill">'+p+'% richtig</span></div><div class="progress"><i style="width:'+p+'%"></i></div><button class="btn" onclick="pageNav(\'lernen\')">Weiterlernen →</button></div><div class="card span5"><div class="cardtitle">Tagesziel</div><div class="metric">'+(profile.daily_goal||30)+' Minuten</div><p class="muted" style="font-size:13px">Plane eine feste Lernzeit pro Tag. Du kannst dein Ziel jederzeit ändern.</p><button class="btn secondary" onclick="pageNav(\'einstellungen\')">Lernziel einstellen</button></div><div class="card span12"><div class="bar"><div class="cardtitle">Deine Lernmodule</div><button class="btn ghost small" onclick="pageNav(\'lernen\')">Alle ansehen</button></div>'+modules.slice(0,4).map(m=>'<div class="topic"><div class="topicicon">'+m.icon+'</div><div class="topicinfo"><strong>'+m.title+'</strong><small>'+m.desc+'</small></div><button class="btn secondary small" onclick="startModule(\''+m.id+'\')">Üben</button></div>').join('')+'</div></div>'}
function learning(){return '<div class="eyebrow">WISSEN AUFBAUEN</div><h1 class="h1">Lernmodule</h1><p class="sub">Wähle ein Thema und festige dein Wissen mit kurzen Wissenschecks.</p><div class="grid">'+modules.map(m=>'<div class="card span6"><div class="bar"><div class="topicicon">'+m.icon+'</div><span class="pill">'+m.level+'</span></div><h3>'+m.title+'</h3><p class="muted" style="font-size:13px;min-height:40px">'+m.desc+'</p><div class="muted" style="font-size:12px">'+m.topics.length+' Themenbereiche</div><div class="progress"><i style="width:'+pct(progressRows.filter(x=>x.module_id===m.id).length,4)+'%"></i></div><button class="btn" onclick="startModule(\''+m.id+'\')">Wissen testen →</button><div style="margin-top:14px;font-size:12px;color:#91a1b1">'+m.topics.map(t=>'• '+t).join('<br>')+'</div></div>').join('')+'</div>'}
function startModule(id){let qs=bank.filter(q=>q[0]===id);if(!qs.length)qs=bank.slice(0,6);questions=qs.sort(()=>Math.random()-.5);qIndex=0;score=0;sessionStart=Date.now();renderQuiz(id)}
function renderQuiz(id,feedback=''){let q=questions[qIndex];frame('<div class="eyebrow">WISSENSCHECK</div><div class="bar"><h1 class="h1">'+(modules.find(m=>m.id===id)?.title||'Prüfungstraining')+'</h1><span class="pill">Frage '+(qIndex+1)+' / '+questions.length+'</span></div><div class="progress"><i style="width:'+pct(qIndex,questions.length)+'%"></i></div><div class="card"><div class="muted" style="font-size:12px">WÄHLE DIE RICHTIGE ANTWORT</div><div class="question">'+esc(q[1])+'</div><div id="answers">'+q[2].map((a,i)=>'<button class="answer" data-answer="'+i+'">'+String.fromCharCode(65+i)+'. '+esc(a)+'</button>').join('')+'</div><div id="explain"></div><div class="bar" style="margin-top:18px"><span class="muted" style="font-size:12px">Richtig: '+score+'</span><button id="next" class="btn hidden">'+(qIndex===questions.length-1?'Ergebnis anzeigen':'Nächste Frage →')+'</button></div></div><button class="btn ghost small" style="margin-top:15px" onclick="pageNav(\'lernen\')">Training verlassen</button>');document.querySelectorAll('[data-answer]').forEach(b=>b.onclick=()=>{if($('#next').classList.contains('hidden')===false)return;let n=+b.dataset.answer,ok=n===q[3];if(ok)score++;document.querySelectorAll('[data-answer]').forEach((x,i)=>{x.disabled=true;if(i===q[3])x.classList.add('correct');else if(i===n)x.classList.add('wrong')});$('#explain').innerHTML='<div class="notice '+(ok?'':'danger')+'">'+(ok?'Richtig! Gut gemacht.':'Leider nicht richtig.')+' '+esc(q[4])+'</div>';$('#next').classList.remove('hidden')});$('#next').onclick=async()=>{qIndex++;if(qIndex<questions.length)renderQuiz(id);else{await saveResult(id,score,questions.length);frame('<div class="card" style="text-align:center;padding:38px"><div style="font-size:48px">🏁</div><div class="eyebrow">TRAINING ABGESCHLOSSEN</div><h1 class="h1">Gut gemacht!</h1><div class="metric">'+score+' / '+questions.length+'</div><p class="sub">Du hast '+pct(score,questions.length)+'% richtig beantwortet.</p><div class="progress"><i style="width:'+pct(score,questions.length)+'%"></i></div><p class="muted">Schau dir die Themen noch einmal an, bei denen du unsicher warst.</p><button class="btn" onclick="pageNav(\'fortschritt\')">Fortschritt ansehen</button> <button class="btn secondary" onclick="pageNav(\'lernen\')">Weiterlernen</button></div>')}}}
function exam(){return '<div class="eyebrow">PRÜFUNGSVORBEREITUNG</div><h1 class="h1">Prüfungstraining</h1><p class="sub">Trainiere gemischte Fragen aus allen Themenbereichen. Die Übungsfragen sind selbst erstellt und keine offiziellen Prüfungsfragen.</p><div class="grid"><div class="card span7"><div class="cardtitle">Gemischte Prüfung starten</div><div class="metric">12 Fragen</div><p class="muted">Zufällige Fragen aus allen Lernmodulen mit direkter Auswertung und Erklärung.</p><button class="btn" onclick="startModule('all')">Prüfung beginnen →</button></div><div class="card span5"><div class="cardtitle">Prüfungstipp</div><p class="sub">Lerne erst die Grundlagen, wiederhole schwierige Themen und mache anschließend einen gemischten Wissenstest. Für praktische Fertigkeiten ist die Ausbildung vor Ort entscheidend.</p></div></div>'}
function progressPage(){let q=totalQuestions(),c=totalCorrect();return '<div class="eyebrow">DEINE ENTWICKLUNG</div><h1 class="h1">Mein Fortschritt</h1><p class="sub">Hier siehst du, wo du schon sicher bist und wo sich Wiederholen lohnt.</p><div class="grid"><div class="card span4"><div class="metric">'+pct(c,q)+'%</div><div class="metriclabel">Gesamte Trefferquote</div></div><div class="card span4"><div class="metric">'+progressRows.length+'</div><div class="metriclabel">Trainings abgeschlossen</div></div><div class="card span4"><div class="metric">'+q+'</div><div class="metriclabel">Fragen beantwortet</div></div><div class="card span12"><div class="cardtitle">Feedback nach Themen</div>'+modules.map(m=>{let a=progressRows.filter(x=>x.module_id===m.id),n=a.reduce((s,x)=>s+(x.total||0),0),v=a.reduce((s,x)=>s+(x.correct||0),0),pc=pct(v,n),label=n===0?'Noch keine Daten':pc>=85?'Sehr gut':pc>=70?'Gut':pc>=50?'Ausbaufähig':'Mehr üben';return '<div class="topic"><div class="topicicon">'+m.icon+'</div><div class="topicinfo"><strong>'+m.title+'</strong><small>'+label+' · '+(n?pc+'% richtig':'Starte deinen ersten Test')+'</small><div class="progress"><i style="width:'+pc+'%"></i></div></div><span class="pill">'+(n?pc+'%':'Neu')+'</span></div>'}).join('')+'</div><div class="notice span12">Die Bewertung ist eine Lernhilfe auf Basis deiner Quizantworten, keine offizielle Leistungsbewertung oder Eignungsfeststellung.</div></div>'}
function materials(){let links=[['Feuerwehr-Lernbar Bayern','Kostenlose Lernmodule, Ausbildungspakete, Quiz und Fachwissen','https://feuerwehr-lernbar.bayern.de/'],['Feuerwehr Wissen','Dienstvorschriften, Geräte, Knoten, Einsatzpraxis und Selbsttests','https://feuerwehr-wissen-bb.de/'],['Deutscher Feuerwehrverband – Ausbildungsunterlagen','Übersicht mit Links zu kostenlosen Ausbildungsangeboten','https://www.feuerwehrverband.de/app/uploads/2024/08/DFV-Uebersicht_Ausbildungsunterlagen_Internet_Aug_2024.pdf'],['LFV Schleswig-Holstein – Downloads','FwDV 1, 2, 3, 7, Lernzielkataloge und weitere Downloads','https://www.lfv-sh.de/der-landesverband/facharbeit/abteilung-1-einsatzvorbereitung-abwicklung'],['DFV direkt','Kostenlose Online-Fortbildungen und Videoaufzeichnungen','https://www.feuerwehrverband.de/veranstaltungen/dfv-direkt/'],['Feuerwehr NRW – Arbeitshilfen','Sammlung von Lernplattformen und fachlichen Arbeitshilfen','https://www.feuerwehr-nrw.de/service/arbeitshilfen/']];return '<div class="eyebrow">KOSTENLOSE QUELLEN</div><h1 class="h1">Lernmaterialien</h1><p class="sub">Ausgewählte frei zugängliche Fachquellen. Bitte prüfe immer, ob Vorschriften und Unterlagen für dein Bundesland aktuell und gültig sind.</p><div class="grid"><div class="card span12">'+links.map(x=>'<div class="topic"><div class="topicicon">📚</div><div class="topicinfo"><strong>'+x[0]+'</strong><small>'+x[1]+'</small></div><a class="btn secondary small" target="_blank" rel="noopener" href="'+x[2]+'">Öffnen ↗</a></div>').join('')+'</div><div class="notice span12">Hinweis: Verlinkte Materialien bleiben Eigentum der jeweiligen Herausgeber. Die Plattform kopiert keine fremden Lehrbücher oder Prüfungsunterlagen. Eigene Lernfragen dienen der Orientierung und ersetzen keine offizielle Ausbildung.</div></div>'}
async function groups(){let list=[];if(sb){let r=await sb.from('study_rooms').select('id,name,description,created_at').order('created_at',{ascending:false});list=r.data||[]}else list=localGet().rooms||[];return '<div class="eyebrow">LERNEN IM TEAM</div><h1 class="h1">Gemeinsam lernen</h1><p class="sub">Erstelle einen Lernraum und teile den Raumcode mit deinen Kameraden. Gemeinsam Fragen wiederholen und Lernziele verfolgen.</p><div class="grid"><div class="card span5"><div class="cardtitle">Neuen Lernraum erstellen</div><label>Name der Lerngruppe</label><input id="roomName" class="field" placeholder="z. B. BF Prüfungsvorbereitung"><label>Beschreibung</label><input id="roomDesc" class="field" placeholder="Themen und Lernziel"><button id="createRoom" class="btn">Lernraum erstellen</button><hr style="border-color:var(--line);margin:22px 0"><div class="cardtitle">Mit Raumcode beitreten</div><input id="roomCode" class="field" placeholder="Raumcode eingeben"><button id="joinRoom" class="btn secondary">Beitreten</button></div><div class="card span7"><div class="cardtitle">Offene Lerngruppen</div>'+(list.length?list.map(x=>'<div class="room"><strong>'+esc(x.name)+'</strong><p class="muted" style="font-size:12px">'+esc(x.description||'Gemeinsam lernen')+'</p><div class="bar"><span class="pill">Code: '+esc(x.id.slice(0,8).toUpperCase())+'</span><button class="btn secondary small" onclick="openRoom(\''+x.id+'\')">Raum öffnen</button></div></div>').join(''):'<p class="muted">Noch keine Lerngruppen vorhanden. Erstelle den ersten Raum!</p>')+'</div></div>'}
async function createRoom(){let name=$('#roomName').value.trim(),description=$('#roomDesc').value.trim();if(!name)return toast('Bitte gib einen Namen ein.');if(!sb)return toast('Für gemeinsame Lerngruppen zuerst Supabase einrichten (siehe README).');let {data,error}=await sb.from('study_rooms').insert({name,description,created_by:user.id}).select().single();if(error)return toast(error.message);await sb.from('room_members').insert({room_id:data.id,user_id:user.id});toast('Lernraum erstellt!');pageNav('gruppen')}
async function joinRoom(){let code=$('#roomCode').value.trim();if(!sb)return toast('Für gemeinsame Lerngruppen zuerst Supabase einrichten.');let {data,error}=await sb.from('study_rooms').select('id').ilike('id',code+'%').maybeSingle();if(error||!data)return toast('Raum nicht gefunden. Prüfe den Code.');let r=await sb.from('room_members').upsert({room_id:data.id,user_id:user.id});if(r.error)return toast(r.error.message);toast('Du bist dem Lernraum beigetreten.');openRoom(data.id)}
async function openRoom(id){if(!sb)return toast('Gemeinsame Räume benötigen die Online-Datenbank.');let r=await sb.from('study_rooms').select('*').eq('id',id).single();if(r.error)return toast(r.error.message);let m=await sb.from('room_members').select('user_id,profiles(display_name)').eq('room_id',id);let room=r.data;selectedRoom=id;frame('<div class="eyebrow">LERNGRUPPE</div><h1 class="h1">'+esc(room.name)+'</h1><p class="sub">'+esc(room.description||'Gemeinsam lernen')+'</p><div class="grid"><div class="card span7"><div class="cardtitle">Raum-Informationen</div><p>Teile diesen Code mit deinen Lernpartnern:</p><div class="metric">'+id.slice(0,8).toUpperCase()+'</div><button class="btn secondary small" id="copyCode">Code kopieren</button><p class="muted" style="font-size:12px">Raumchat und Live-Quiz können im nächsten Ausbau ergänzt werden. Hier ist zunächst die gemeinsame Raumverwaltung verfügbar.</p></div><div class="card span5"><div class="cardtitle">Mitglieder ('+(m.data||[]).length+')</div>'+((m.data||[]).map(x=>'<div class="topic"><div class="topicicon">👤</div><strong>'+esc(x.profiles?.display_name||'Mitglied')+'</strong></div>').join('')||'<p class="muted">Noch keine Mitglieder</p>')+'</div></div><button class="btn ghost" onclick="pageNav(\'gruppen\')">← Zurück zu Gruppen</button>');$('#copyCode').onclick=()=>navigator.clipboard.writeText(id.slice(0,8).toUpperCase()).then(()=>toast('Raumcode kopiert'))}
function settings(){return '<div class="eyebrow">DEIN PROFIL</div><h1 class="h1">Einstellungen</h1><div class="grid"><div class="card span6"><div class="cardtitle">Persönliche Angaben</div><label>Anzeigename</label><input id="displayName" class="field" value="'+esc(profile.display_name||'')+'"><label>Dein tägliches Lernziel (Minuten)</label><input id="goal" class="field" type="number" min="5" max="480" value="'+(profile.daily_goal||30)+'"><button class="btn" id="saveSettings">Speichern</button></div><div class="card span6"><div class="cardtitle">Dein Konto</div><p class="muted">'+esc(user?.email||'Gastmodus')+'</p><div class="notice">'+(sb?'Dein Konto und Lernstand werden online gespeichert und sind nach erneuter Anmeldung verfügbar.':'Demo-Modus: Deine Daten bleiben nur in diesem Browser. Für dauerhaftes Speichern und gemeinsame Lerngruppen richte Supabase ein (Anleitung in README).')+'</div></div></div>'}
function render(){if(page==='dashboard')frame(dashboard());if(page==='lernen')frame(learning());if(page==='pruefung')frame(exam());if(page==='fortschritt')frame(progressPage());if(page==='material')frame(materials());if(page==='einstellungen')frame(settings());if(page==='gruppen')groups().then(h=>{if(page==='gruppen'){frame(h);$('#createRoom').onclick=createRoom;$('#joinRoom').onclick=joinRoom}});if(page==='einstellungen'){$('#saveSettings').onclick=saveProfile}}
async function logout(){if(sb)await sb.auth.signOut();user=null;authScreen()}
function authScreen(){if(!ready){$('#root').innerHTML='<div class="authwrap"><div class="card auth"><div class="brand"><div class="brandmark">✚</div><div>BF LERNAKADEMIE<small>BERUFSFEUERWEHR · TRAINING</small></div></div><div class="pill red">DEMO-MODUS</div><h1>Starte dein Training.</h1><p class="sub">Du kannst die Lernmodule direkt ausprobieren. Für dauerhaftes Konto, Synchronisierung und Lerngruppen müssen die kostenlosen Supabase-Zugangsdaten eingetragen werden. Die Anleitung liegt in README.md.</p><label>Dein Anzeigename</label><input id="guestName" class="field" placeholder="Dein Name" value="Feuerwehr-Azubi"><button class="btn" style="width:100%" id="guest">Als Gast starten →</button><p class="footer">Demo-Daten bleiben auf diesem Gerät in diesem Browser gespeichert.</p></div></div>';$('#guest').onclick=async()=>{profile={display_name:$('#guestName').value||'Feuerwehr-Azubi',daily_goal:30};user={email:'Gastmodus'};await loadData();render()};return}
$('#root').innerHTML='<div class="authwrap"><div class="card auth"><div class="brand"><div class="brandmark">✚</div><div>BF LERNAKADEMIE<small>BERUFSFEUERWEHR · TRAINING</small></div></div><h1>Willkommen zurück.</h1><p class="sub">Melde dich an oder erstelle dein persönliches Lernkonto.</p><div class="bar"><button class="btn secondary small" id="tabLogin">Anmelden</button><button class="btn ghost small" id="tabSignup">Konto erstellen</button></div><label>E-Mail-Adresse</label><input id="email" class="field" type="email" placeholder="name@beispiel.de"><label>Passwort</label><input id="password" class="field" type="password" placeholder="Mindestens 8 Zeichen"><div id="authMsg" class="muted" style="font-size:12px;margin:5px 0 12px"></div><button class="btn" id="authAction" style="width:100%">Anmelden</button></div></div>';let mode='login';const setMode=m=>{mode=m;$('#authAction').textContent=m==='login'?'Anmelden':'Konto erstellen';$('#tabLogin').className='btn '+(m==='login'?'secondary':'ghost')+' small';$('#tabSignup').className='btn '+(m==='signup'?'secondary':'ghost')+' small'};$('#tabLogin').onclick=()=>setMode('login');$('#tabSignup').onclick=()=>setMode('signup');$('#authAction').onclick=async()=>{let email=$('#email').value.trim(),password=$('#password').value;if(!email||password.length<8)return $('#authMsg').textContent='Bitte E-Mail und ein Passwort mit mindestens 8 Zeichen eingeben.';let r=mode==='signup'?await sb.auth.signUp({email,password}):await sb.auth.signInWithPassword({email,password});if(r.error)return $('#authMsg').textContent=r.error.message;if(mode==='signup'&&!r.data.session)return $('#authMsg').textContent='Bitte bestätige deine E-Mail-Adresse über den zugesandten Link.';user=r.data.user;await loadData();render()}}
async function init(){if(!ready)return authScreen();let {data:{session}}=await sb.auth.getSession();if(session){user=session.user;await loadData();render()}else authScreen();sb.auth.onAuthStateChange(async(_e,s)=>{if(s&&!user){user=s.user;await loadData();render()}else if(!s&&user){user=null;authScreen()}})}
window.pageNav=pageNav;window.startModule=startModule;window.openRoom=openRoom;init();
</script></body></html>
